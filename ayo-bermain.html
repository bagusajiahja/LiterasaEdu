<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan Surat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>✉️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="literasa.css">
<style>*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:var(--f-b);color:var(--ink);display:flex;flex-direction:column;--fs:clamp(9.5px,1.55vh,15px)}
header{display:flex;align-items:center;gap:12px;padding:6px 16px;height:62px;position:relative;z-index:2}
.logo{font:800 clamp(18px,3.2vh,26px) var(--f-h);letter-spacing:-.02em;white-space:nowrap;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo a{color:inherit!important}
.steps{display:flex;gap:6px;padding:4px;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh-s)}
.pill{padding:3px 14px;border-radius:999px;font:700 13px var(--f-h);color:var(--mut);transition:.3s var(--spring)}
.pill.on{background:var(--g1);color:#fff;box-shadow:0 8px 14px -8px rgba(106,76,255,.9)}
.mas{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.bubble{background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 14px;font:700 clamp(12px,1.9vh,15px) var(--f-b);max-width:46vw;position:relative;box-shadow:var(--sh-s);animation:inn .4s both}
.bubble::after{content:"";position:absolute;right:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-left:10px solid #fff;filter:drop-shadow(1px 0 0 var(--line))}
.bird{font-size:42px;animation:hop 1.6s infinite}
@keyframes hop{50%{transform:translateY(-6px) rotate(6deg)}}
.snd{border:1px solid var(--line);background:#fff;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;padding:0;box-shadow:var(--sh-s);transition:transform .3s var(--spring)}
.snd:hover{transform:scale(1.12) rotate(-8deg)}.snd:active{transform:scale(.9)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,34vw,420px);gap:14px;padding:0 14px 14px;position:relative;z-index:2}
.paper{background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px 16px;font-family:"Times New Roman",serif;font-size:var(--fs);line-height:1.3;display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto;box-shadow:var(--sh);color:#111}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.pool{flex:1;min-height:0;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:10px;overflow:auto;column-count:2;column-gap:8px;box-shadow:var(--sh-s);font-size:calc(var(--fs)*.9)}
.pool h3{column-span:all;margin:0 0 8px;font:800 15px var(--f-h);text-align:center;color:var(--ink2)}
.pool .chip{break-inside:avoid;margin:0 0 8px;padding:7px 9px;border-radius:14px;border:2px solid #fff;box-shadow:0 8px 14px -8px rgba(40,20,120,.5);background:var(--c);color:#111;font-family:"Times New Roman",serif;transition:transform .25s var(--spring),box-shadow .25s}
.pool .chip:hover{transform:translateY(-3px) rotate(-.8deg);box-shadow:0 14px 20px -10px rgba(40,20,120,.55)}
.pool .chip.big{column-span:all}
.pool .chip.nm,.row .chip{font-family:var(--f-h);font-weight:700;text-align:center;font-size:calc(var(--fs)*1.05)}
.chip{cursor:grab;touch-action:none;user-select:none}
.chip:active{cursor:grabbing}
.chip p{margin:0 0 4px}
.ghost{position:fixed;z-index:950;pointer-events:none;transform:rotate(-4deg) scale(1.06);border-radius:14px;border:2px solid #fff;padding:7px 9px;box-shadow:0 22px 30px -10px rgba(40,20,120,.6);font-size:12px;background:var(--c);color:#111;font-family:"Times New Roman",serif}
.ghost.nm{font-family:var(--f-h);font-weight:700;font-size:14px}
.slot{border:2px dashed #cbbff7;border-radius:12px;padding:2px 6px;flex:var(--g) 1 0;min-height:min-content;background:#faf8ff;transition:.2s;display:flex;flex-direction:column;justify-content:center}
.slot .ph{color:#a79ad8;font:700 calc(var(--fs)*.95) var(--f-b)}
.slot.full{border-style:solid;border-color:#e0d8ff;background:#fff}
.paper .slot .chip{background:none;border:0;box-shadow:none;padding:0;margin:0}
.paper .slot .chip:hover{transform:none;box-shadow:none}
.slot.ok{border:2px solid var(--ok);background:#e6faf2}
.slot.bad{border:2px solid var(--bad);background:#fff0f2;animation:shake .45s}
.note{font:700 calc(var(--fs)*.92) var(--f-b);color:#d11a38;margin-top:1px}
.row{display:grid;grid-template-columns:clamp(110px,16vw,170px) 22px minmax(0,1fr);align-items:center;gap:4px;flex:var(--g) 1 0;min-height:min-content}
.row .slot{flex:none;align-self:stretch;min-height:30px;align-items:center;text-align:center}
.row .slot .chip{padding:3px 6px;border-radius:10px;background:var(--c);border:2px solid #fff;width:100%}
.row .slot.bad .chip{background:#ffb3b3}
.arrow{font-size:18px;color:var(--pink);text-align:center;animation:nudge 1s infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
.blk p{margin:0 0 3px;text-indent:1.5em}
.kop{text-align:center;border-bottom:3px double #111;padding-bottom:3px}
.btns{display:flex;gap:8px}
button.b{flex:1;position:relative;overflow:hidden;font:800 clamp(13px,2vh,16px) var(--f-h);border:0;border-radius:999px;padding:10px 14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#14d6a2,#0ea5a0);box-shadow:0 12px 18px -10px #0ea5a0,inset 0 1px 0 rgba(255,255,255,.4);transition:transform .3s var(--spring)}
button.b:hover{transform:translateY(-2px) scale(1.03)}
button.b:active{transform:scale(.95)}
button.b.o{background:#fff;color:var(--v);box-shadow:0 0 0 2px var(--v2) inset,var(--sh-s)}
button.b.p{background:var(--g1);box-shadow:0 12px 18px -10px rgba(106,76,255,.9),inset 0 1px 0 rgba(255,255,255,.4)}
#ov{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(106,76,255,.82),rgba(22,12,70,.92));backdrop-filter:blur(6px)}
#ov.show{display:flex}
.card{background:linear-gradient(180deg,#fff,#f6f1ff);border-radius:32px;padding:24px 34px;text-align:center;max-width:min(92vw,620px);animation:pop .7s var(--spring);box-shadow:0 0 0 6px rgba(255,255,255,.35),0 50px 80px -20px rgba(0,0,0,.55)}
.card h1{margin:0;font:800 clamp(30px,7vh,56px)/1 var(--f-h);letter-spacing:-.03em;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent;animation:wob 1.4s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-2.5deg) scale(1)}to{transform:rotate(2.5deg) scale(1.06)}}
.card p{font:600 clamp(14px,2.6vh,20px)/1.5 var(--f-b);margin:12px 0 16px;color:var(--ink2)}
.card .em{font-size:clamp(36px,8vh,70px);animation:bob 2s ease-in-out infinite}
.stars{font-size:clamp(30px,7vh,56px);letter-spacing:6px}
.rain{position:fixed;top:-60px;z-index:880;font-size:30px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#cv{position:fixed;inset:0;z-index:1000;pointer-events:none}
body.inf .paper,body.inf .pool .chip:not(.nm),body.inf .ghost:not(.nm){font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:calc(var(--fs)*1.1)}
body.inf .paper{background:#fffef5 repeating-linear-gradient(transparent 0 1.6em,#e3e9ff 1.6em calc(1.6em + 1px))}
.menu{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.start{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-align:center}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 190px}.bubble{display:none}}
@media(max-width:760px){.pool{column-count:1}.pool .chip{margin-bottom:7px}}
@media(max-width:520px){header{gap:6px;padding:6px 10px}.logo{font-size:14px}.steps{padding:3px}.pill{padding:2px 9px;font-size:11px;white-space:nowrap}.bird{font-size:30px}.snd{width:30px;height:30px;font-size:14px}}
</style>
</head>
<body>
<script src="literasa.js"></script>
<header>
  <div class="logo">✉️ Petualangan Surat</div>
  <div class="steps" id="steps"></div>
  <div class="mas"><div class="bubble" id="say"></div><div class="bird">🐥</div><button class="snd" id="snd" title="Suara">🔊</button></div>
</header>
<main id="app"></main>
<div id="ov"></div>
<canvas id="cv"></canvas>

<script>
const FORMAL=[
{id:'kop',name:'Kop surat',hint:'identitas sekolah di bagian paling atas surat',al:'center',g:60,c:'#e4d4ff',
 html:'<div class="kop"><b style="font-size:1.3em">SMA NEGERI 12 PURWOKERTO</b><br>Jl. Semogalanggeng, Purwokerto, Banyumas</div>'},
{id:'tgl',name:'Tempat dan tanggal',hint:'tempat dan tanggal surat dibuat, di kanan atas',al:'right',g:28,c:'#ffe58a',html:'Purwokerto, 12 Februari 2025'},
{id:'nomor',name:'Nomor',hint:'nomor surat, tepat di bawah kop',al:'left',g:28,c:'#ffc0da',html:'Nomor &nbsp;&nbsp;&nbsp;: 005/SMAN12/II/2025'},
{id:'lamp',name:'Lampiran',hint:'jumlah berkas yang dilampirkan (“-” jika tidak ada)',al:'left',g:28,c:'#b9e6ff',html:'Lampiran : -'},
{id:'hal',name:'Hal',hint:'inti isi surat dalam satu frasa',al:'left',g:28,c:'#bff5ae',html:'Hal &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;: Permohonan Izin Kegiatan'},
{id:'alamat',name:'Alamat tujuan',hint:'penerima surat: “Kepada Yth.”, nama, jabatan, tempat',al:'left',g:80,c:'#ddc8ff',
 html:'Kepada Yth.<br>Bapak Bagus Windu Aji<br>Kepala Sekolah SMA Negeri 12 Purwokerto<br>di<br>&nbsp;&nbsp;&nbsp;&nbsp;Jl. Semogalanggeng, Purwokerto'},
{id:'buka',name:'Salam pembuka',hint:'sapaan awal sebelum isi surat',al:'left',g:28,c:'#a9d8ff',html:'Dengan hormat,'},
{id:'isi',name:'Isi surat',hint:'paragraf pembuka, isi, dan penutup surat',al:'left',g:120,c:'#ffc9a8',big:1,
 html:'<p>Sehubungan dengan kegiatan ekstrakurikuler yang akan dilaksanakan oleh OSIS SMA Negeri 12 Purwokerto pada tanggal 20 Februari 2025, kami mengajukan permohonan izin penggunaan aula sekolah untuk kegiatan tersebut.</p><p>Demikian surat permohonan ini kami sampaikan. Besar harapan kami Bapak berkenan memberikan izin. Atas perhatian dan persetujuannya, kami ucapkan terima kasih.</p>'},
{id:'tutup',name:'Salam penutup',hint:'kalimat penutup sebelum tanda tangan (hormat kami)',al:'left',g:28,c:'#c8f0a0',html:'Hormat kami,'},
{id:'ttd',name:'Tanda tangan',hint:'jabatan, tanda tangan, dan nama terang pengirim',al:'right',g:80,c:'#ffd1f0',
 html:'Pemohon,<br><i>(tanda tangan)</i><br>Dhea Elsa Septiana<br>NIS. 0123456789'}
];
const NONFORMAL=[
{id:'tgl',name:'Tanggal dan tempat penulisan',hint:'tempat dan tanggal surat ditulis, di kanan atas',al:'right',g:28,c:'#e4d4ff',html:'Purwokerto, 10 Oktober 2026'},
{id:'sp',name:'Salam pembuka',hint:'sapaan akrab untuk penerima di awal surat',al:'left',g:28,c:'#ffc0da',html:'Hai, Windu!'},
{id:'pb',name:'Pembuka surat',hint:'menanyakan kabar sebelum masuk ke inti surat',al:'left',g:45,c:'#a9d8ff',html:'Apa kabar? Semoga kamu selalu baik-baik saja dan tetap semangat menjalani kuliahmu.'},
{id:'isi',name:'Isi surat',hint:'inti pesan atau cerita yang ingin disampaikan',al:'left',g:130,c:'#bff5ae',big:1,
 html:'Aku nulis surat ini buat ngajakin kamu jalan-jalan ke Parangtritis. Jadi, hari Selasa nanti aku libur kerja, soalnya ada jadwal cuti yang udah disetujui. Aku mikir, daripada cuma di rumah, mending kita manfaatin waktu buat main ke pantai. Udara lautnya pasti enak banget, sekalian cari makan siang di sekitar pantai. Kamu juga pasti butuh refreshing setelah banyak tugas dan kerjaan, kan?'},
{id:'pi',name:'Penutup isi',hint:'ajakan, kesimpulan, atau harapan di akhir isi surat',al:'left',g:80,c:'#ffe58a',big:1,
 html:'Gimana, tertarik? Kalau kamu nggak ada agenda lain, aku berangkat jam 7 pagi dari Purwokerto. Nanti aku jemput di kos, ya. Jangan lupa bawa baju ganti, sunscreen, dan kamera kalau ada. Biar bisa foto-foto juga.'},
{id:'sg',name:'Salam penutup',hint:'tanda berpamitan sebelum nama pengirim',al:'left',g:28,c:'#ddc8ff',html:'Salam,'},
{id:'nama',name:'Nama pengirim',hint:'nama penulis surat di bagian paling bawah',al:'left',g:28,c:'#ffc0da',html:'Dhea Elsa Septiana'}
];
let P=FORMAL,mode='formal',byId={};
function setP(m){mode=m;P=m==='formal'?FORMAL:NONFORMAL;byId=Object.fromEntries(P.map(p=>[p.id,p]));document.body.classList.toggle('inf',m==='nonformal')}
function pick(m){setP(m);wrongChecks=0;startStage(1)}
setP('formal');
const app=document.getElementById('app'),sayEl=document.getElementById('say'),ov=document.getElementById('ov');
let stage=0,A={},R={},order=[],done=false,wrongChecks=0,muted=false;

/* ---------- suara ---------- */
let AC;
function tone(f,t,d,type='sine',v=.15){if(muted)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={pop:()=>tone(700,0,.08),ok:()=>[523,659,784].forEach((f,i)=>tone(f,i*.1,.25,'triangle')),bad:()=>tone(180,0,.3,'sawtooth',.07),
 win:()=>[523,659,784,1047,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.12,.35,'triangle',.18))};
document.getElementById('snd').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};

/* ---------- konfeti ---------- */
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let ps=[],loop=0,rainOn=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
const COL=['#ff5d8f','#ffd23f','#22c55e','#38bdf8','#a78bfa','#ff9f1c'],EM=['⭐','🎉','🎈','✨','💖','🌟'];
function burst(n=140){
  for(let i=0;i<n;i++){const left=i%2,a=(left?-1:1)*(Math.random()*.6+.2);
    ps.push({x:left?0:cv.width,y:cv.height*.9,vx:(left?1:-1)*(4+Math.random()*10),vy:-(8+Math.random()*14),w:6+Math.random()*8,c:COL[i%6],r:Math.random()*6,vr:Math.random()*.4-.2,e:Math.random()<.2?EM[i%6]:null})}
  if(!loop)tick();
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=p.vr;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);
    if(p.e){cx.font='22px serif';cx.fillText(p.e,0,0)}else{cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2)}
    cx.restore()});
  ps=ps.filter(p=>p.y<cv.height+40);
  if(ps.length||rainOn)loop=requestAnimationFrame(tick);else{loop=0;cx.clearRect(0,0,cv.width,cv.height)}
}
function rainStars(n=18){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='rain';d.textContent=EM[i%6];
  d.style.left=Math.random()*100+'vw';d.style.animationDuration=(3+Math.random()*3)+'s';d.style.animationDelay=Math.random()*2+'s';
  document.body.appendChild(d);setTimeout(()=>d.remove(),8000)}}
function celebrate(){sfx.win();burst(180);setTimeout(()=>burst(120),500);rainStars()}

/* ---------- tampilan ---------- */
const say=t=>sayEl.innerHTML=t;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function startStage(s){stage=s;A={};R={};done=false;ov.className='';order=shuffle(P.map(p=>p.id));if(s<=1&&s===0)wrongChecks=0;if(s===1)wrongChecks=0;
  say(s===1?'Seret bagian surat ke kertas kosong ya! 📄':s===2?'Sekarang beri nama tiap bagian! Ikuti tanda panah ➜':'');render()}
const chip=(p,from,locked)=>`<div class="chip ${stage===2?'nm':''} ${stage===1&&p.big?'big':''} ${locked?'locked':''}" style="--c:${p.c}" data-id="${p.id}" data-from="${from}">${stage===1?p.html:p.name}</div>`;
const note=p=>R[p.id]==='bad'?`<div class="note">❌ Seharusnya: ${p.name} — ${p.hint}</div>`:'';
function slot1(p){const a=A[p.id],r=R[p.id];
  return `<div class="slot ${r||''} ${a?'full':''}" data-slot="${p.id}" style="--g:${p.g};text-align:${p.al}">`+(a?chip(byId[a],p.id,r==='ok'):'<span class="ph">✏️ taruh di sini</span>')+note(p)+`</div>`}
function row2(p){const a=A[p.id],r=R[p.id];
  return `<div class="row" style="--g:${p.g}"><div class="slot ${r||''} ${a?'full':''}" data-slot="${p.id}">`+(a?chip(byId[a],p.id,r==='ok'):'<span class="ph">seret nama</span>')+
  `</div><div class="arrow">➜</div><div><div class="blk" style="text-align:${p.al}">${p.html}</div>${note(p)}</div></div>`}

function render(){
  document.getElementById('steps').innerHTML=[1,2].map(n=>`<span class="pill ${stage===n?'on':''}">Halaman ${n}</span>`).join('');
  if(stage===0){document.body.classList.remove('inf');say('Halo! Aku Kiko 🐥 Yuk belajar surat!');
    app.innerHTML=`<div class="start"><div class="card" style="animation:none"><div class="em">✉️🐥📬</div><h1>Ayo Jadi Jagoan Surat!</h1>
    <p>Halaman 1: susun surat di kertas kosong.<br>Halaman 2: beri nama setiap bagian surat.<br>Pilih jenis suratnya, lalu kumpulkan bintang! ⭐</p>
    <div class="menu"><button class="b" style="width:auto;padding:10px 26px" onclick="pick('formal')">📨 Surat Formal</button><button class="b o" style="width:auto;padding:10px 26px" onclick="pick('nonformal')">💌 Surat Nonformal</button></div></div></div>`;return}
  const placed=new Set(Object.values(A));
  const items=order.filter(id=>!placed.has(id)).map(id=>chip(byId[id],'',false)).join('');
  app.innerHTML=`<div class="paper">${P.map(stage===1?slot1:row2).join('')}</div>
  <div class="side"><div class="pool" id="pool"><h3>${stage===1?'🧩 Bagian surat':'🏷️ Nama bagian'}</h3>${items||'<div style="column-span:all;text-align:center;font-weight:800">Semua sudah terpasang ✔</div>'}</div>
  <div class="btns">${done?`<button class="b p" onclick="finish()">Selesai 🏆</button>`:`<button class="b" onclick="check()">✔ Periksa!</button><button class="b o" onclick="startStage(stage)">↺ Ulangi</button>`}</div></div>`;
}

function check(){
  let ok=0;P.forEach(p=>{if(A[p.id]===p.id){R[p.id]='ok';ok++}else R[p.id]='bad'});
  if(ok===P.length){done=true;render();win();return}
  wrongChecks++;sfx.bad();
  say(ok>=6?`Hampir! ${ok} dari ${P.length} benar 💪 Perbaiki yang merah ya!`:`${ok} dari ${P.length} benar. Semangat, baca catatan merahnya! 🔍`);render();
}
function win(){
  celebrate();
  const s1=stage===1;
  say(s1?'YEEEAY! Kamu hebat! 🎉':'WOW! Kamu jagoan! 🏆');
  ov.className='show';
  ov.innerHTML=`<div class="card"><div class="em">${s1?'🎉🥳🎊':'🏆🌟👑'}</div><h1>${s1?'HEBAT BANGET!':'LUAR BIASA!'}</h1>
   <p>${s1?'Susunan suratmu sudah TEPAT! Kamu pintar sekali! 👏👏👏':'Semua nama bagian sudah BENAR! Kamu jagoan surat! 👏👏👏'}</p>
   ${s1?`<button class="b" onclick="startStage(2)">Lanjut ke Halaman 2 🚀</button>`:`<button class="b o" onclick="ov.className='';burst(80)">Lihat hasil suratku 👀</button>`}</div>`;
}
function lapor(k,s,n){try{if(parent!==window)parent.postMessage({literasa:'game',k:k,s:s,n:n},'*')}catch(e){}}
function finish(){
  const st=wrongChecks===0?3:wrongChecks<=3?2:1;
  lapor('l3',st===3?100:st===2?85:75,100);
  celebrate();rainOn=1;setTimeout(()=>rainOn=0,6000);
  say('Terima kasih sudah bermain! 💖');
  ov.className='show';
  ov.innerHTML=`<div class="card"><div class="em">🎊🏆🎊</div><h1>SELAMAT!</h1>
   <div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
   <p>Terima kasih telah mengerjakan! 🙌<br>Kamu sudah menguasai struktur surat ${mode==='formal'?'formal':'nonformal'}.<br>Pertahankan semangat belajarmu! 🌈</p>
   <div class="btns"><button class="b" onclick="pick(mode)">Main Lagi 🔄</button><button class="b o" onclick="pick(mode==='formal'?'nonformal':'formal')">Coba surat ${mode==='formal'?'nonformal 💌':'formal 📨'}</button><button class="b p" onclick="startStage(0)">Menu 🏠</button></div></div>`;
  [0,900,1800,2700].forEach(t=>setTimeout(()=>{burst(100);rainStars(10)},t));
}

/* ---------- drag & drop (mouse + sentuh) ---------- */
let drag=null;
function move(e){drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px'}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.chip');if(!c||c.classList.contains('locked')||done)return;
  e.preventDefault();
  const r=c.getBoundingClientRect(),g=c.cloneNode(true);
  g.className='ghost'+(stage===2?' nm':'');g.style.width=Math.min(r.width,300)+'px';g.style.setProperty('--c',byId[c.dataset.id].c);
  document.body.appendChild(g);
  drag={id:c.dataset.id,from:c.dataset.from,g,dx:Math.min(e.clientX-r.left,60),dy:Math.min(e.clientY-r.top,20)};
  c.style.opacity=.3;move(e);
});
document.addEventListener('pointermove',e=>{if(drag)move(e)});
function end(e){
  if(!drag)return;const d=drag;drag=null;d.g.remove();
  const t=document.elementFromPoint(e.clientX,e.clientY),z=t&&t.closest('[data-slot],#pool');
  if(z&&e.type==='pointerup')drop(d,z);render();
}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
function drop(d,z){
  const s=z.dataset.slot;
  if(s){if(R[s]==='ok')return;const old=A[s];
    if(d.from){delete A[d.from];delete R[d.from];if(old)A[d.from]=old}
    A[s]=d.id;delete R[s];sfx.pop()}
  else if(d.from){delete A[d.from];delete R[d.from];sfx.pop()}
}
if(top===self){const lg=document.querySelector('.logo');lg.innerHTML='<a href="index.html" style="color:inherit;text-decoration:none" title="Kembali ke beranda">🏠 Petualangan Surat</a>'}
render();
</script>
