<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6a4cff"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Kantor Pos Kelas | Literasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="literasa.css">
<style>
/* ===== Kantor Pos Kelas — tampilan baru ===== */
body{padding-bottom:0}
h2{font:800 1.5rem/1.15 var(--f-h);margin:8px 0 6px}h3{font:700 1.05rem var(--f-h);margin:18px 0 6px}
p{margin:.5em 0}.mut{color:var(--mut);font-size:.92rem}
a{color:var(--v);font-weight:700}

/* ---- header ---- */
header{position:relative;overflow:hidden;color:#fff;background:var(--g1);border-radius:0 0 36px 36px;
  padding:18px max(20px,calc((100% - 820px)/2)) 26px;box-shadow:0 26px 44px -26px rgba(106,76,255,.85)}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
header::before{width:240px;height:240px;right:-70px;top:-100px;animation:float 9s ease-in-out infinite}
header::after{width:130px;height:130px;left:-40px;bottom:-60px;animation:float 11s ease-in-out -4s infinite}
header>*{position:relative;z-index:1}
.back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);color:#fff;text-decoration:none;
  font:700 .85rem var(--f-h);padding:6px 14px;border-radius:999px;transition:transform .3s var(--spring),background .2s}
.back:hover{background:rgba(255,255,255,.32);transform:translateX(-3px)}
header h1{margin:14px 0 2px;font:800 clamp(1.9rem,7vw,2.7rem)/1.05 var(--f-h);letter-spacing:-.03em;color:#fff}
header h1 em{font-style:normal;display:inline-block;animation:wig 3s ease-in-out infinite;transform-origin:70% 80%}
@keyframes wig{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-14deg) scale(1.15)}80%{transform:rotate(10deg) scale(1.15)}90%{transform:rotate(-6deg)}}
header p{margin:0 0 14px;color:#f4ecff;font-weight:500}
.plane{position:absolute!important;top:16px;font-size:1.6rem;animation:fly 10s linear infinite;z-index:0!important;opacity:.9}
@keyframes fly{from{left:-12%;transform:translateY(0) rotate(8deg)}50%{transform:translateY(18px) rotate(-4deg)}to{left:108%;transform:translateY(-6px) rotate(8deg)}}
.fl{position:absolute!important;font-size:1.3rem;opacity:.75;animation:float 6s ease-in-out infinite;z-index:0!important}
.st{display:flex;gap:8px;flex-wrap:wrap}
.stamp{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  font:700 .74rem var(--f-h);color:#e9dfff;transition:.4s var(--spring)}
.stamp i{font-style:normal;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);font-size:.9rem;filter:grayscale(1);opacity:.7}
.stamp.on{background:#fff;color:var(--ink);border-color:#fff;box-shadow:0 8px 16px -8px rgba(0,0,0,.4);animation:pop .6s var(--spring)}
.stamp.on i{background:var(--g3);filter:none;opacity:1}

main{max-width:820px;margin:0 auto;padding:20px 16px 130px}
section{display:none}section.a{display:block;animation:inn .45s both}

/* ---- kartu & akordeon ---- */
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px 18px;margin:14px 0;box-shadow:var(--sh-s)}
details{background:#fff;border:1px solid var(--line);border-radius:22px;margin:12px 0;padding:0 18px 1px;box-shadow:var(--sh-s);overflow:hidden;transition:box-shadow .3s,border-color .3s}
details[open]{box-shadow:var(--sh);border-color:#d9d0ff}
summary{list-style:none;cursor:pointer;font:700 1.02rem var(--f-h);margin:0 -18px;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:background .2s}
summary:hover{background:var(--tint)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:9px;height:9px;border-right:3px solid var(--v);border-bottom:3px solid var(--v);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .35s var(--spring)}
details[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details[open]>*:not(summary){animation:inn .4s both}
details .card{background:var(--bg);box-shadow:none}

/* ---- tabel ---- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;margin:12px 0;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.9rem}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
tr:first-child th{border-top:0}
th{background:var(--tint);color:var(--v);font:800 .8rem var(--f-h);letter-spacing:.03em}
tr:not(:first-child):hover td{background:#faf8ff}
ul,ol{padding-left:1.3em}li{margin:.3em 0}
.fig{width:100%;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--sh-s)}

/* ---- kuis ---- */
.q{counter-reset:o;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--sh-s)}
.q>p:first-child{margin:0 0 12px;font-size:1.02rem}
.q>p:first-child>b:first-child{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;border-radius:10px;background:var(--g1);color:#fff;margin-right:8px;font:800 .85rem var(--f-h)}
.o{counter-increment:o;appearance:none;display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0;padding:11px 14px;
  border:2px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:600 .96rem/1.4 var(--f-b);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s var(--spring),border-color .2s,background .2s,box-shadow .2s}
.o::before{content:counter(o,upper-alpha);flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--v);font:800 .82rem var(--f-h);transition:.3s var(--spring)}
.o:hover:not(:disabled){border-color:var(--v2);transform:translateX(4px);background:#faf8ff}
.o:active:not(:disabled){transform:scale(.98)}
.o.s{border-color:var(--v);background:var(--tint)}.o.s::before{background:var(--v);color:#fff}
.o.ok{border-color:var(--ok);background:#e3faf1;animation:pop .5s var(--spring)}.o.ok::before{content:"✓";background:var(--ok);color:#fff}
.o.no{border-color:var(--bad);background:#ffe9ed;animation:shake .45s}.o.no::before{content:"✕";background:var(--bad);color:#fff}
.o:disabled{cursor:default}
.ex{font-size:.9rem;color:var(--ink2);margin:8px 0 0;padding:0}.ex:not(:empty){background:var(--tint);border-radius:14px;padding:9px 13px;animation:inn .4s both}
.res{background:var(--g1);color:#fff;border-radius:22px;padding:16px 18px;margin:14px 0;box-shadow:0 18px 30px -18px rgba(106,76,255,.9);animation:pop .6s var(--spring)}
.res .btn{background:#fff;color:var(--v);margin-left:10px;padding:7px 16px;font-size:.85rem;box-shadow:none}

/* ---- form ---- */
input,textarea{width:100%;padding:11px 14px;margin:6px 0;border:2px solid var(--line);border-radius:16px;font:500 1rem var(--f-b);background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:0;border-color:var(--v);box-shadow:0 0 0 4px rgba(106,76,255,.15)}

/* ---- dok navigasi bawah ---- */
#nav{display:none}
.bn{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:flex;gap:4px;width:min(92vw,400px);padding:6px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 40px -14px rgba(40,20,120,.45)}
.bn button{flex:1;border:0;background:transparent;border-radius:22px;font:700 .74rem var(--f-h);color:var(--mut);padding:7px 0 6px;cursor:pointer;transition:background .3s,color .3s,transform .3s var(--spring)}
.bn button span{display:block;font-size:1.35rem;transition:transform .4s var(--spring)}
.bn button.a{background:var(--g1);color:#fff;box-shadow:0 10px 18px -8px rgba(106,76,255,.8)}
.bn button.a span{transform:translateY(-2px) scale(1.2) rotate(-6deg)}
.bn button:active{transform:scale(.92)}

/* ---- peta belajar (beranda) ---- */
.hero-card{position:relative;overflow:hidden;color:#fff;background:var(--g1);border-radius:30px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;box-shadow:0 28px 44px -26px rgba(106,76,255,.95)}
.hero-card::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.12);right:-60px;top:-80px;animation:float 8s ease-in-out infinite}
.hero-card h2{color:#fff;margin:0;font-size:1.35rem}.hero-card p{margin:4px 0 0;color:#f4ecff;font-size:.95rem}
.hero-card>*{position:relative}
.rw{position:relative;width:92px;height:92px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffd75e calc(var(--p)*1%),rgba(255,255,255,.28) 0);transition:--p 1.3s cubic-bezier(.3,.8,.3,1);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px))}
.rw b{position:absolute;inset:0;display:grid;place-items:center;font:800 1.35rem var(--f-h)}
.bub{grid-column:1/-1;display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:10px 14px;font-size:.92rem;line-height:1.45}
.bub .av{font-size:1.9rem;animation:bob 2s ease-in-out infinite}.bub b{display:block;font:700 .78rem var(--f-h);color:#ffe9a3;letter-spacing:.02em}

.path{position:relative;margin:26px 0 12px;padding:4px 0}
.path::before{content:"";position:absolute;left:50%;top:14px;bottom:14px;width:4px;margin-left:-2px;border-radius:4px;
  background:repeating-linear-gradient(#b9a9ff 0 10px,transparent 10px 20px);background-size:4px 20px;animation:flow 1.2s linear infinite;opacity:.7}
@keyframes flow{to{background-position:0 20px}}
.nd{--c:#6a4cff;position:relative;display:flex;align-items:center;gap:13px;width:88%;margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--sh-s);
  padding:12px 16px 12px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:transform .35s var(--spring),box-shadow .3s}
.nd:nth-child(even){margin-left:auto;flex-direction:row-reverse;text-align:right}
.nd:nth-child(1){--c:#6a4cff}.nd:nth-child(2){--c:#ff4fa3}.nd:nth-child(3){--c:#0ea5a0}.nd:nth-child(4){--c:#3b82f6}.nd:nth-child(5){--c:#f97316}
.nd:hover{transform:translateY(-5px) rotate(-.8deg);box-shadow:var(--sh)}
.nd:nth-child(even):hover{transform:translateY(-5px) rotate(.8deg)}
.nd .ic{flex:none;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:1.8rem;background:var(--c);box-shadow:0 12px 18px -10px var(--c);transform:rotate(-6deg);transition:transform .4s var(--spring)}
.nd:hover .ic{transform:rotate(6deg) scale(1.1)}
.nd .tx{flex:1;min-width:0}.nd .tx b{display:block;font:700 1rem/1.25 var(--f-h)}.nd small{display:block;color:var(--mut);font-size:.82rem;line-height:1.35;margin-top:2px}
.nd.done{background:#f1fcf8;border-color:#bdeedd}.nd.done .ic{background:var(--ok);animation:pop .6s var(--spring)}
.nd.cur{border-color:var(--c);animation:pulse 2s ease-out infinite}
.nd.cur::after{content:"Lanjut ▸";position:absolute;top:-11px;right:14px;background:var(--c);color:#fff;font:800 .68rem var(--f-h);padding:3px 10px;border-radius:999px;animation:bob 1.6s ease-in-out infinite}
.nd:nth-child(even).cur::after{right:auto;left:14px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 45%,transparent),var(--sh-s)}80%,100%{box-shadow:0 0 0 18px transparent,var(--sh-s)}}

/* ---- level ---- */
.lb{position:relative;overflow:hidden;border-radius:30px;padding:22px 22px 20px;margin:12px 0 14px;color:#fff;box-shadow:var(--sh)}
.lb::before,.lb::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.15);pointer-events:none}
.lb::before{width:170px;height:170px;right:-46px;top:-64px;animation:float 8s ease-in-out infinite}
.lb::after{width:90px;height:90px;right:64px;bottom:-44px;animation:float 10s ease-in-out -3s infinite}
.lb .bg{display:inline-block;font-size:2.5rem;line-height:1;animation:bob 2s ease-in-out infinite}
.lb h2{margin:6px 0 0!important;color:#fff}.lb p{position:relative;max-width:30em}
.stp{display:flex;gap:4px;margin:14px 0;padding:5px;background:#fff;border:1px solid var(--line);border-radius:999px;box-shadow:var(--sh-s)}
.stp button{flex:1;border:0;background:transparent;border-radius:999px;font:700 .82rem var(--f-h);padding:10px 4px;color:var(--mut);cursor:pointer;transition:background .3s,color .3s,transform .3s var(--spring)}
.stp button:active{transform:scale(.94)}
.stp .a{background:var(--g1);color:#fff;box-shadow:0 10px 16px -8px rgba(106,76,255,.8)}
.stp .dn{color:var(--ok)}.stp .dn::before{content:"✓ "}
.pn{display:none}.pn.a{display:block;animation:inn .4s both}
.nx{margin:26px 0;text-align:center}.nx .btn{padding:14px 28px}
.nx .btn::after{content:"";}
.btn.sm{box-shadow:0 8px 14px -8px rgba(106,76,255,.8)}

/* ---- lencana ---- */
.g4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bd{position:relative;overflow:hidden;text-align:center;background:#fff;border:1px solid var(--line);border-radius:26px;padding:20px 10px 16px;box-shadow:var(--sh-s)}
.bd .md{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 8px;border-radius:50%;font-size:2.1rem;background:var(--tint);filter:grayscale(1);opacity:.6}
.bd b{display:block;font:800 1rem var(--f-h)}.bd small{display:block;color:var(--mut);font-size:.8rem;margin-top:3px;line-height:1.35}
.bd.on{border-color:#ffd978;background:linear-gradient(180deg,#fffbe9,#fff)}
.bd.on .md{background:var(--g3);filter:none;opacity:1;box-shadow:0 14px 22px -10px #ff9f1c,0 0 0 6px #ffe9a8;animation:pop .7s var(--spring)}
.bd.on::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);animation:shine 3.4s ease-in-out infinite}
.lock{display:inline-block;font-size:.9rem}

/* ---- amplop pembuka ---- */
#ov{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 28%,rgba(106,76,255,.9),rgba(22,12,70,.95) 70%);backdrop-filter:blur(8px);display:none;place-items:center;padding:20px}
#ov.on{display:grid;animation:inn .3s both}
.evw{text-align:center;color:#fff;margin-top:110px}.evw #oh{font:700 1rem var(--f-h);animation:bob 1.6s ease-in-out infinite}
.ev{position:relative;width:min(320px,84vw);height:200px;margin:0 auto 18px;cursor:pointer;perspective:900px;filter:drop-shadow(0 30px 30px rgba(0,0,0,.4))}
.ev>div{position:absolute}.ev .bk{inset:0;background:#ff9d3c;border-radius:14px}
.ev .lt{left:7%;right:7%;top:64px;height:170px;background:#fff;border-radius:10px;padding:16px;color:var(--ink);transition:transform .8s .45s var(--spring);z-index:2;overflow:hidden;text-align:left;border-top:6px solid var(--pink)}
.ev .lt b{font:800 1.15rem var(--f-h)}.ev .lt p{font-size:.88rem;margin:6px 0;color:var(--ink2)}
.ev .fr{inset:0;background:#ffbb54;border-radius:14px;clip-path:polygon(0 38%,50% 74%,100% 38%,100% 100%,0 100%);z-index:3}
.ev .fl2{left:0;right:0;top:0;height:148px;background:#ffae3a;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s;z-index:4;border-radius:14px 14px 0 0}
.ev .sl{left:calc(50% - 22px);top:98px;width:44px;height:44px;border-radius:50%;background:var(--g1);border:3px solid #fff;display:grid;place-items:center;z-index:5;transition:opacity .3s;font-size:1.2rem;box-shadow:0 8px 14px rgba(0,0,0,.3)}
.ev.open .fl2{transform:rotateX(180deg);z-index:1}.ev.open .sl{opacity:0}.ev.open .lt{transform:translateY(-162px)}
.ev:not(.open){animation:bob 1.6s ease-in-out infinite}
#ob{visibility:hidden}.ev.open~#ob{visibility:visible;animation:pop .6s var(--spring)}

/* ---- stempel lencana baru ---- */
.sg{position:fixed;inset:0;z-index:98;display:grid;place-items:center;pointer-events:none}
.sg div{background:#fff;border-radius:28px;padding:20px 34px;text-align:center;font:800 1.5rem var(--f-h);color:var(--ink);box-shadow:0 0 0 6px #ffd978,0 40px 60px -20px rgba(0,0,0,.5);animation:slam .55s var(--spring) both,out .4s 2.1s forwards}
.sg small{display:inline-block;background:var(--g1);color:#fff;border-radius:999px;padding:2px 14px;font:800 .7rem var(--f-h);letter-spacing:.1em;margin-bottom:6px}
.sg span{display:block;font-size:2.6rem;margin-bottom:2px}
@keyframes slam{from{transform:scale(2.6) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}@keyframes out{to{opacity:0;transform:scale(.9) translateY(-20px)}}

/* ---- game layar penuh ---- */
#gm{position:fixed;inset:0;z-index:120;background:#120d2e;display:none;flex-direction:column}
#gm.on{display:flex;animation:sheet .45s var(--spring) both}
@keyframes sheet{from{transform:translateY(60px);opacity:0}}
#gm .gb{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff;font:700 1rem var(--f-h)}
#gm .gb b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gm .gb .btn{background:rgba(255,255,255,.16);box-shadow:none}
#gm iframe{flex:1;border:0;width:100%;background:#fff}
.gcard{text-align:center;background:linear-gradient(160deg,#fff,#f4efff)}.gcard .big{font-size:2.8rem;line-height:1.2;animation:bob 2.4s ease-in-out infinite}
.gcard .btn{margin-top:12px;font-size:1.05rem;padding:14px 26px}
@media(max-width:480px){.nd{width:94%}.hero-card{grid-template-columns:1fr;justify-items:start}.rw{width:84px;height:84px}}
</style></head><body>
<script src="literasa.js"></script>
<header><span class="plane" aria-hidden="true">✈️</span><span class="fl" style="left:62%;top:40px;animation-delay:-2s" aria-hidden="true">✉️</span><span class="fl" style="right:7%;top:92px;animation-delay:-4s" aria-hidden="true">⭐</span><a class="back" href="index.html">← Beranda Literasa</a><h1><em>💌</em> Kantor Pos Kelas</h1><p>Petualangan Surat Formal dan Nonformal ✨ SMP Kelas VII</p><div class="st" id="stamps"></div></header>
<nav id="nav"></nav>
<div id="gm" role="dialog" aria-modal="true" aria-label="Game"><div class="gb"><b id="gt"></b><button class="btn sm" id="gx">✕ Tutup</button></div><iframe id="gf" title="Game" allow="autoplay"></iframe></div>
<div id="ov"><div class="evw"><div class="ev" id="ev"><div class="bk"></div><div class="lt"><b id="ot"></b><p id="ox"></p></div><div class="fr"></div><div class="fl2"></div><div class="sl">💌</div></div><p id="oh">Ketuk amplop untuk membuka ✉️</p><button class="btn" id="ob">Masuk</button></div></div>
<main>
<section id="home"></section>
<section id="peta"></section>
<section id="materi"></section>
<section id="bedah"></section>
<section id="latihan"></section>
<section id="pilah"></section>
<section id="misi"></section>
<section id="asesmen"></section>
<section id="lencana"></section>
</main>
<script>
const $=s=>document.querySelector(s);
let P={};try{P=JSON.parse(localStorage.getItem('kps')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('kps',JSON.stringify(P))}catch(e){}};
const tb=(h,r)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>';
const FN=['Formal','Nonformal'];
const BADGES=[['l1','Detektif Muda'],['l2','Ahli Bedah Surat'],['l3','Detektif Bahasa'],['l4','Petugas Pos Teladan']];

/* ===== MESIN KUIS ===== */
function quiz(el,items,fb,done){
  el.innerHTML='';const ans=[];let fin=false;
  const qs=items.map((it,i)=>{
    const d=document.createElement('div');d.className='q';d.innerHTML='<p><b>'+(i+1)+'.</b> '+it[0]+'</p>';
