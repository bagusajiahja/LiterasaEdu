<script>
const $=s=>document.querySelector(s);
let P={};try{P=JSON.parse(localStorage.getItem('kps')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('kps',JSON.stringify(P))}catch(e){}};
const tb=(h,r)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>';
const FN=['Formal','Nonformal'];
const BADGES=[['l1','Detektif Muda'],['l2','Ahli Bedah Surat'],['l3','Detektif Bahasa'],['l4','Petugas Pos Teladan']];

/* ===== MESIN KUIS ===== */
function quiz(el,items,fb,done){
  el.innerHTML='';const ans=[];let fin=false;
  const qs=items.map((it,i)=>{
    const d=document.createElement('div');d.className='q';d.innerHTML='<p><b>'+(i+1)+'.</b> '+it[0]+'</p>';
    it[1].forEach((t,j)=>{const b=document.createElement('button');b.className='o';b.textContent=t;
      b.onclick=()=>{if(d.dataset.l)return;ans[i]=j;d.querySelectorAll('.o').forEach(x=>x.classList.remove('s'));b.classList.add('s');if(fb)rev(i);upd()};d.append(b)});
    const e=document.createElement('p');e.className='ex';d.append(e);el.append(d);return d});
  function rev(i){const d=qs[i],it=items[i];d.dataset.l=1;
    d.querySelectorAll('.o').forEach((b,j)=>{if(j==it[2])b.classList.add('ok');else if(j==ans[i])b.classList.add('no')});
    if(it[3])d.querySelector('.ex').textContent=(ans[i]==it[2]?'Benar. ':'Belum tepat. ')+it[3]}
  const bar=document.createElement('div');el.append(bar);
  const go=document.createElement('button');go.className='btn';go.textContent='Periksa jawaban';go.disabled=true;
  if(!fb)bar.append(go);
  function upd(){const all=items.every((_,i)=>ans[i]!==undefined);go.disabled=!all;if(fb&&all)finish()}
  go.onclick=()=>{items.forEach((_,i)=>rev(i));finish()};
  function finish(){if(fin)return;fin=true;go.remove();
    const s=items.filter((it,i)=>ans[i]==it[2]).length;
    const r=document.createElement('div');r.className='res';r.innerHTML='<b>Skor: '+s+' dari '+items.length+'</b> ';
    const rb=document.createElement('button');rb.className='btn';rb.textContent='Ulangi';rb.onclick=()=>quiz(el,items,fb,done);r.append(rb);bar.append(r);
    done&&done(s,items.length)}
}
const award=(k,s,n)=>{P[k]=Math.max(P[k]||0,Math.round(100*s/n));save();stamps()};
const on=g=>!!P['d'+g];
function stamps(){if(window.renderL)renderL();$('#stamps').innerHTML=BADGES.map(b=>'<div class="stamp'+(on(b[0])?' on':'')+'">'+b[1]+'</div>').join('')}

/* ===== DATA ===== */
const MATERI=[
['M1 Apa sih surat itu?','<p>Surat adalah sarana komunikasi tertulis untuk menyampaikan maksud, informasi, atau perasaan kepada orang atau lembaga lain. Fungsinya: menyampaikan pesan kepada pihak yang jauh, menjadi bukti tertulis, menjadi arsip, dan menjaga hubungan baik.</p>'+tb(['Tujuan','Contoh situasi'],[['Memberi kabar','Bercerita liburan kepada sahabat atau nenek'],['Memberitahukan','Sekolah memberi tahu jadwal kegiatan kepada orang tua'],['Memohon','Murid memohon izin tidak masuk; OSIS memohon izin memakai aula'],['Mengundang','Sekolah mengundang wali murid rapat; undangan ulang tahun'],['Menyampaikan perasaan','Ucapan terima kasih, selamat, atau rindu']])+'<p class="mut">Jeda Detektif: tulis pengertian surat dengan kalimatmu sendiri dan dua tujuan surat.</p>'],
['M2 Jenis surat: formal dan nonformal','<p>Jenis surat ditentukan oleh penerima dan tujuannya. Kesopanan bukan penentu, sebab surat nonformal pun harus santun.</p>'+tb(['Aspek','Formal','Nonformal'],[['Penerima','Lembaga atau orang yang dihormati (kepala sekolah, wali kelas, wali murid)','Teman, sahabat, keluarga'],['Tujuan','Izin, permohonan, pemberitahuan, undangan resmi','Kabar, cerita, ucapan, undangan santai'],['Struktur','Lengkap: kop, nomor, lampiran, hal, alamat tujuan, dst.','Sederhana dan bebas'],['Bahasa','Baku, lugas, sangat hormat','Santai dan akrab, tidak kasar']])],
['M3 Struktur surat formal (10 unsur)','<p>Pahami lewat fungsinya: apa akibatnya bila bagian itu hilang?</p>'+tb(['No','Unsur','Fungsi','Jika hilang'],[[1,'Kop surat','Identitas lembaga pengirim','Tidak tahu surat dari lembaga mana'],[2,'Nomor surat','Penanda urutan arsip','Sulit dicari dan diarsipkan'],[3,'Lampiran','Jumlah berkas yang dikirim (“-” bila tidak ada)','Tidak tahu ada berkas yang harus diperiksa'],[4,'Hal (perihal)','Pokok isi dalam satu frasa','Harus membaca semuanya dulu'],[5,'Tempat dan tanggal','Tempat dan waktu surat dibuat','Batas waktu menjadi kabur'],[6,'Alamat tujuan','Kepada siapa surat ditujukan','Tidak jelas siapa yang menanggapi'],[7,'Salam pembuka','Sapaan hormat','Surat terasa tiba-tiba'],[8,'Isi surat','Pembuka, rincian, penutup','Maksud tidak tersampaikan'],[9,'Salam penutup','Penutup yang hormat','Surat berhenti mendadak'],[10,'Tanda tangan dan nama terang','Pengesahan dan identitas','Surat tidak sah, penulis tidak diketahui']])],
['M4 Struktur surat nonformal (7 unsur)','<p>Bentuknya bebas, tetapi tiap bagian tetap punya fungsi.</p>'+tb(['No','Unsur','Contoh','Jika hilang'],[[1,'Tempat dan tanggal','Bandung, 9 November 2026','Tidak tahu kapan ditulis'],[2,'Salam pembuka','Halo, Dinda!','Terasa dingin dan tiba-tiba'],[3,'Pembuka isi','Apa kabar? Semoga sehat, ya.','Kurang ramah'],[4,'Isi surat','Aku mau cerita, kelasku juara satu.','Tidak ada pesan'],[5,'Penutup isi','Kabari aku ya kalau bisa datang.','Tidak tahu yang diharapkan'],[6,'Salam penutup','Salam sayang,','Berhenti mendadak'],[7,'Nama pengirim','Rani','Tidak tahu penulisnya']])],
['M5 Membandingkan struktur (Kembar tapi beda)','<p><b>Ada pada kedua jenis:</b> tempat dan tanggal, salam pembuka, isi surat, salam penutup, nama pengirim.</p><p><b>Hanya pada surat formal:</b> kop surat (bila dari lembaga), nomor surat, lampiran, hal, alamat tujuan.</p>'],
['M6 Kaidah kebahasaan surat','<p>Lima aspek: ragam bahasa, kata sapaan, pilihan kata dan kalimat, kesantunan, ejaan (EBI Edisi V).</p>'+tb(['Aspek','Formal','Nonformal'],[['Ragam','Baku, lugas. “Saya memohon izin tidak mengikuti pelajaran.”','Santai, akrab. “Aku nggak bisa masuk sekolah, ya.”'],['Sapaan','Yth., Bapak/Ibu, Saudara; saya/kami','Nama panggilan, kamu, kakak; aku'],['Pilihan kata','sehubungan dengan, mohon, berkenan, demikian','ya, yuk, nih dipakai wajar'],['Kesantunan','Sangat hormat: mohon, terima kasih','Tetap sopan, tidak mengejek'],['Ejaan','Kapital, kata depan, tanda baca benar','Aturan sama']])+tb(['Akrab','Baku','Akrab','Baku'],[['nggak','tidak','banget','sekali'],['gimana','bagaimana','cuma','hanya'],['udah','sudah','bilang','mengatakan'],['bikin','membuat','kasih tahu','memberi tahu']])+tb(['Keliru','Benar'],[['dirumah','di rumah'],['silahkan','silakan'],['terimakasih; ijin','terima kasih; izin'],['hari sabtu, 14 november 2026','hari Sabtu, 14 November 2026'],['pukul 08.00 wib','pukul 08.00 WIB'],['Dengan hormat.','Dengan hormat,'],['yth. bapak kepala sekolah','Yth. Bapak Kepala Sekolah']])],
['M7 Tiga Petunjuk Detektif','<ol><li><b>Kepada siapa dan untuk apa?</b> Lembaga atau orang yang dihormati dengan urusan resmi (formal), atau teman dan keluarga dengan urusan pribadi (nonformal).</li><li><b>Bagaimana strukturnya?</b> Ada kop, nomor, lampiran, hal, alamat tujuan (formal), atau bebas diawali tanggal dan sapaan akrab (nonformal).</li><li><b>Bagaimana bahasanya?</b> Baku, lugas, sangat hormat (formal), atau santai dan akrab tetapi santun (nonformal).</li></ol>'],
['M8 Anggapan keliru yang perlu diluruskan','<ul><li>“Surat nonformal boleh asal-asalan.” Yang benar: lebih akrab, tetapi tetap jelas dan santun.</li><li>“Surat yang sopan pasti formal.” Yang benar: jenis ditentukan penerima, tujuan, dan struktur.</li><li>“Surat formal harus panjang dan berkata sulit.” Yang benar: jelas, lengkap, ringkas, baku.</li><li>“Semua surat formal pakai kop.” Yang benar: kop untuk lembaga; surat perseorangan biasanya tanpa kop.</li><li>“Bagian surat cukup dihafal urutannya.” Yang benar: pahami fungsinya.</li></ul><p class="mut">Jeda Detektif: jelaskan ulang satu pelurusan dengan bahasamu sendiri memakai “karena ...”.</p>'],
['Contoh surat formal utuh','<div class="card"><b>OSIS SMP NEGERI 1 CONTOH</b><br>Jalan Pendidikan No. 10, Contoh<br>Nomor: 012/OSIS/XI/2026<br>Lampiran: 1 berkas<br>Hal: Permohonan izin penggunaan aula<br>Contoh, 9 November 2026<br><br>Yth. Kepala SMP Negeri 1 Contoh<br>di Tempat<br><br>Dengan hormat,<br>Sehubungan dengan rencana kegiatan bakti sosial OSIS, kami memohon izin menggunakan aula sekolah pada Sabtu, 21 November 2026, pukul 08.00 sampai 12.00 WIB. Kegiatan tersebut diikuti oleh seluruh pengurus OSIS dan perwakilan tiap kelas. Demikian surat permohonan ini kami sampaikan. Atas perhatian dan izin Bapak, kami mengucapkan terima kasih.<br><br>Hormat kami,<br>Ketua OSIS<br>Raka Pratama</div><h3>Isi surat formal: tiga bagian</h3>'+tb(['Bagian','Fungsi','Contoh'],[['Pembuka','Latar belakang atau alasan surat','Sehubungan dengan rencana kegiatan bakti sosial OSIS, ...'],['Rincian','Apa, kapan, di mana, untuk apa','... memohon izin menggunakan aula pada Sabtu, 21 November 2026 ...'],['Penutup','Harapan dan terima kasih','Atas perhatian dan izin Bapak, kami mengucapkan terima kasih.']])],
['Contoh surat nonformal utuh','<div class="card">Bandung, 9 November 2026<br><br>Halo, Dinda!<br>Apa kabar? Semoga kamu sehat dan selalu semangat, ya.<br>Aku mau cerita, kelasku kemarin juara satu lomba kebersihan. Senang sekali rasanya! Minggu depan main ke rumahku, yuk, nanti kuceritakan seru-serunya.<br>Kabari aku ya kalau kamu bisa datang.<br><br>Salam sayang,<br>Rani</div>'],
['Ungkapan khas surat formal','<ul><li><b>Yth.</b> (Yang terhormat) pada alamat tujuan.</li><li><b>Dengan hormat,</b> salam pembuka; <b>Hormat kami,</b> atau <b>Hormat saya,</b> salam penutup.</li><li><b>Sehubungan dengan ...</b> membuka latar belakang.</li><li><b>mohon</b>, <b>memohon</b>, <b>berkenan</b> menyatakan permintaan dengan hormat.</li><li><b>Demikian surat ini kami sampaikan. Atas perhatian Bapak/Ibu, kami mengucapkan terima kasih.</b> sebagai penutup isi.</li></ul>'],
['Mengenali jenis surat dari situasinya',tb(['Situasi','Jenis','Petunjuk penentu'],[['Murid memberi tahu wali kelas bahwa ia sakit dan tidak masuk sekolah','Formal','Penerima wali kelas; izin resmi'],['Murid menceritakan lomba kepada sahabat yang pindah kota','Nonformal','Penerima sahabat; memberi kabar'],['OSIS meminta izin memakai aula kepada kepala sekolah','Formal','Penerima kepala sekolah; permohonan resmi'],['Murid mengundang teman ke ulang tahunnya','Nonformal','Penerima teman; undangan pribadi'],['Sekolah mengundang wali murid menghadiri rapat','Formal','Penerima wali murid; undangan resmi']])]
];
const KILAT=[['Surat izin tidak masuk sekolah untuk wali kelas paling tepat dibuka dengan ...',['Hai, Bu Guru!','Yth. Ibu Wali Kelas, Dengan hormat,','Bu, dengerin ya.','Halo, wali kelasku!'],1,'Surat resmi memakai Yth. dan “Dengan hormat,”.'],
['Kalimat yang paling cocok untuk surat kepada sahabat yang pindah kota ...',['Aku kangen, nih. Kapan kamu main ke sini?','Bersama surat ini kami memohon kehadiran Saudara.','Atas perhatian Bapak, kami mengucapkan terima kasih.','Demikian surat ini kami sampaikan.'],0,'Sahabat berarti bahasa akrab.'],
['Bagian surat yang memberi tahu siapa penulisnya ...',['Salam pembuka','Tempat dan tanggal','Nama pengirim','Alamat tujuan'],2,'Nama pengirim menunjukkan identitas penulis.']];
const L1=[['Surat A: “Yth. Bapak Kepala SMP ... Dengan hormat, ... memohon izin tidak mengikuti pelajaran ... Hormat saya, Siti.” Surat ini formal atau nonformal?',FN,0,'Penerima kepala sekolah, tujuan izin resmi, bahasa baku.'],
['Pasangan penerima dan tujuan yang tepat untuk surat nonformal adalah ...',['Kepala sekolah, permohonan izin','Wali murid, undangan rapat resmi','Sahabat, bercerita tentang liburan','Ketua RW, pemberitahuan'],2,'Nonformal: teman atau keluarga dengan urusan pribadi.'],
['Tujuan menulis surat yang termasuk “menyampaikan perasaan” adalah ...',['Mengucapkan terima kasih kepada teman','Memohon izin memakai aula','Memberi tahu jadwal rapat','Mengajukan permohonan'],0,'Terima kasih, selamat, dan rindu adalah perasaan.'],
['Surat dari OSIS kepada kepala sekolah untuk meminjam aula termasuk surat ...',FN,0,'Penerima kepala sekolah, tujuan permohonan resmi.']];
const L2=[['Bagian yang menunjukkan identitas lembaga pengirim adalah ...',['Kop surat','Hal','Lampiran','Salam pembuka'],0,'Kop memuat nama dan alamat lembaga.'],
['Jika surat formal tidak memuat tempat dan tanggal, akibatnya ...',['Penerima tidak tahu siapa pengirim','Waktu surat dibuat dan batas waktu menjadi kabur','Isi tidak terbaca','Surat menjadi nonformal'],1,'Fungsi tanggal adalah penanda waktu.'],
['Unsur yang HANYA ada pada surat formal adalah ...',['Salam penutup','Nama pengirim','Nomor surat dan hal','Tempat dan tanggal'],2,'Kop, nomor, lampiran, hal, dan alamat tujuan hanya milik surat formal.'],
['“Apa kabar? Semoga kamu sehat, ya.” pada surat nonformal adalah ...',['Salam penutup','Pembuka isi','Penutup isi','Nama pengirim'],1,'Mengawali isi dengan menanyakan kabar.']];
const L3=[['“Saya memohon izin tidak mengikuti pelajaran.” memakai ragam ...',['Baku','Akrab','Kasar','Daerah'],0,'Kata memohon, tidak, mengikuti bersifat baku.'],
['Padanan baku dari “gimana” dan “banget” adalah ...',['bagaimana, sekali','bagai mana, banyak','gemana, amat','bagaimana, nian'],0,''],

bukti('Tulis dugaanmu: “Menurutku Surat ... untuk ... karena ...”. Baca dugaan dua temanmu dan beri reaksi pada yang paling meyakinkan.','l1')+nxt('bedah','Lanjut ke Level 2');
quiz($('#mis'),MIS,true,(x,n)=>award('mis',x,n));

/* Level 2 */
$('#bedah').innerHTML='<h2>Level 2: Bedah Surat</h2>'+pt1+flow('Materi → Game → Kesimpulan → Bukti di Padlet')+'<p>Kita akan mempelajari pengertian, jenis, dan struktur surat. Pahami fungsi tiap bagian, jangan menghafal urutan.</p>'+
st(1,'Materi')+det([0,1,2])+
'<details open><summary>CONTOH SURAT FORMAL (bernomor)</summary>'+fig('surat-formal.jpg','Contoh surat formal dengan bagian bernomor',letter(FL)+legend(SF10))+'<p class="mut">Catatan: panah nomor 6 menunjuk alamat tujuan (Yth. ...). Salam pembuka surat ini adalah “Dengan hormat,”.</p></details>'+
det([3])+'<details open><summary>Contoh surat nonformal (bernomor)</summary>'+fig('surat-nonformal.jpg','Contoh surat nonformal dengan tujuh bagian bernomor',letter(NL)+legend(SN))+'</details>'+det([4])+
st(2,'Game')+'<div class="card"><b>Kenali Surat dari Petunjuknya</b><div id="kn"></div></div><p class="mut">Surat Bedah 1 dan 2 serta tantangan Surat Rusak dikerjakan pada LKPD.</p>'+
st(3,'Kesimpulan Materi Surat')+'<div class="card"><p>Surat merupakan sarana komunikasi tertulis yang digunakan untuk menyampaikan informasi, pesan, permohonan, maupun keperluan tertentu kepada orang lain. Secara umum, surat dibedakan menjadi dua jenis, yaitu surat formal dan surat nonformal.</p><p>Surat formal digunakan untuk kepentingan resmi, seperti keperluan sekolah, organisasi, atau lembaga. Surat ini memiliki struktur yang lebih lengkap dan menggunakan bahasa baku serta sopan. Sementara itu, surat nonformal digunakan untuk keperluan pribadi, seperti berkomunikasi dengan teman atau keluarga, sehingga bahasanya lebih santai, akrab, dan fleksibel.</p></div>'+
bukti('Jeda Detektif (pengertian surat dan dua tujuan; dua contoh surat formal dan dua contoh surat nonformal beserta penerimanya). Laporan Bedah pada kartu CONTOH SURAT FORMAL: “Nomor ... adalah ...; fungsinya ...; jika hilang ...” (minimal tiga bagian), lalu tanggapi dua temanmu.','l2')+nxt('pilah','Lanjut ke Level 3');
quiz($('#kn'),KN,true,(x,n)=>award('kn',x,n));

/* Level 3 */
$('#pilah').innerHTML='<h2>Level 3: Detektif Bahasa</h2>'+pt2+flow('Materi → Ayo Bermain → Game Pilah Surat → Bukti di Padlet')+
st(1,'Materi')+'<p>Kaidah kebahasaan adalah aturan pemakaian bahasa yang membuat surat sesuai dengan penerima dan tujuannya.</p>'+det([5,10])+
st(2,'Ayo Bermain dan Game')+gameCard+'<div class="card"><b>Pilah Surat, Temukan Kaidah</b><p class="mut">Pilah tiap kalimat ke surat formal atau nonformal.</p><div id="pl"></div></div>'+
bukti('Tulis <b>Hasil Pilah</b> pada komentar kartu game: kata atau ungkapan yang menjadi petunjukmu, karena ...','l3')+nxt('misi','Lanjut ke Level 4');
quiz($('#pl'),KALIMAT,true,(x,n)=>award('pl',x,n));

/* Level 4 */
$('#misi').innerHTML='<h2>Level 4: Misi Akhir Petugas Pos Surat</h2>'+pt2+flow('Materi → Game Detektif Surat Heboh → Kartu Pilihan → Asesmen')+
st(1,'Materi')+det([6,7])+
st(2,'Game: Detektif Surat Heboh')+'<p>Delapan surat belum terpilah! Tentukan jenis tiap surat beserta bukti kutipannya. Kartu Tantangan untuk Jalur Mahir.</p><div class="card lv"><b>Detektif Surat Heboh</b><p>Misi Akhir: delapan Kartu Surat dan dua Kartu Tantangan.</p><a class="btn" style="display:inline-block;text-decoration:none" href="https://bagusajiahja.github.io/AsesmenSurat/" target="_blank" rel="noopener">Mainkan Detektif Surat Heboh</a></div>'+
st(3,'Kartu Pilihan')+bukti('<b>Kartu Pilihan:</b> pilih satu surat yang paling menarik atau paling mengecoh. Sampaikan alasanmu pada komentar kartu Misi Akhir (tulisan, rekaman suara, atau gambar peta konsep), lalu tanggapi dua temanmu dengan santun.','l4')+nxt('asesmen','Lanjut ke Asesmen');


/* Asesmen */
$('#asesmen').innerHTML='<h2>Asesmen “Cocokkan dan Kenali”</h2><p class="mut"><b>Pertemuan 2</b>, akhir kegiatan (20 menit).</p><p>28 butir (A = 6, B = 7, C = 5, D = 10). Catatan materi boleh dibuka: yang dinilai adalah pemahaman. Nilai = skor ÷ 28 × 100.</p><div id="as"></div>';
quiz($('#as'),A.concat(B,C,D),false,(s,n)=>{P.nilai=Math.round(100*s/n);save();const r=document.createElement('div');r.className='res';r.innerHTML='<b>Nilai akhir: '+P.nilai+'</b>';$('#as').append(r)});

function showId(){$('#idc').innerHTML=P.nm?'<div class="res">Petugas <b>'+P.nm.replace(/</g,'&lt;')+'</b>: “Surat atau pesan yang pernah kuterima atau kutulis adalah '+(P.kl||'...').replace(/</g,'&lt;')+'”</div>':''}
function saveId(){P.nm=$('#nm').value.trim();P.kl=$('#kl').value.trim();save();showId()}
$('#nm').value=P.nm||'';$('#kl').value=P.kl||'';showId();

/* Ruang Lencana dan Refleksi */
const BD=[['l1','Detektif Muda','Level 1: Surat Misterius'],['l2','Ahli Bedah Surat','Level 2: Bedah Surat'],['l3','Detektif Bahasa','Level 3: Detektif Bahasa'],['l4','Petugas Pos Teladan','Level 4: Misi Akhir']];
const NM={mis:'Level 1: Surat Misterius',kn:'Kenali Surat dari Petunjuknya',pl:'Pilah Surat, Temukan Kaidah'};
function renderL(){var el=$('#lencana');if(!el)return;if(document.activeElement&&document.activeElement.tagName=='TEXTAREA')return;
el.innerHTML='<h2>Ruang Lencana dan Refleksi</h2><h3>Daftar Lencana (berbentuk prangko)</h3><div class="g4">'+BD.map(b=>on(b[0])?'<div class="card">🏅 <b>'+b[1]+'</b><br>Diraih</div>':'<div class="card">🔒 <b>'+b[1]+'</b><br><span class="mut">'+b[2]+' (tandai selesai di akhir level)</span></div>').join('')+'</div><div class="card"><b>Bukti Latihan</b><p class="mut">Tulis skor ini di komentar kartu Ruang Lencana dan Refleksi di Padlet, atau tempel tangkapan layarnya.</p>'+tb(['Kegiatan','Skor'],Object.keys(NM).map(k=>[NM[k],P[k]!==undefined?P[k]+'%':'belum dikerjakan']))+'</div><div class="card"><b>Refleksi</b><p>Satu hal yang berubah dari pemahamanku tentang surat adalah ...</p><textarea id="rf" rows="3"></textarea><p>Bagian yang masih membingungkan bagiku ...</p><textarea id="rg" rows="2"></textarea><button class="btn" onclick="P.rf=$(\'#rf\').value;P.rg=$(\'#rg\').value;save();this.textContent=\'Tersimpan\'">Simpan refleksi</button><p class="mut">Salin refleksimu ke komentar kartu Ruang Lencana dan Refleksi di Padlet.</p></div>';
$('#rf').value=P.rf||'';$('#rg').value=P.rg||''}
stamps();show('peta');
